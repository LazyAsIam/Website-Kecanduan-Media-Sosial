<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuesioner Penelitian Mahasiswa</title>
<script>try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand" id="siteTitle"></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Bahasa / Language">
      <button type="button" data-lang="id" aria-pressed="true">ID</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button type="button" id="themeBtn" class="icon" aria-label="Tema">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main>
  <p id="langNote" class="muted" role="note"></p>
  <div id="progress" class="progress"><span id="stepLabel"></span><div class="bar"><i id="barFill"></i></div></div>
  <div id="app"></div>
  <noscript><p>Aktifkan JavaScript untuk mengisi kuesioner ini. / Please enable JavaScript to fill in this questionnaire.</p></noscript>
</main>
<footer id="footer"></footer>
<script src="config.js"></script>
<script src="instrument.js"></script>
<script src="translations.js"></script>
<script src="submit.js"></script>
<script src="script.js"></script>
</body>
</html>
